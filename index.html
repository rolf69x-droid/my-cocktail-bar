}
function renderPair(gin,tonic){const existing=pairings.find(p=>p.gin===gin&&p.tonic===tonic),suggestion=suggested.find(p=>p[0]===gin&&p[1]===tonic);
app.innerHTML=`<button class="back" id="gnt-back">← Back to pairings</button><h1 style="font-size:30px">${esc(gin)} + ${esc(tonic)}</h1><p>${esc(existing?.note||suggestion?.[2]||'An untested combination to explore.')}</p><h3 class="section">Suggested serve</h3><div class="card"><div class="ingredient"><span>${esc(gin)}</span><span>50 ml</span></div><div class="ingredient"><span>${esc(tonic)}</span><span>100–125 ml</span></div><div class="ingredient"><span>Ice</span><span>Plenty</span></div></div><ol class="steps"><li>Fill a chilled highball glass with ice.</li><li>Add gin and slowly top with chilled tonic.</li><li>Stir gently once. Taste before adding a garnish.</li></ol><h3 class="section">Your verdict</h3><label>Status<select class="field" id="pair-status"><option value="suggested" ${!existing||existing.status==='suggested'?'selected':''}>Want to try</option><option value="tried" ${existing?.status==='tried'?'selected':''}>Tried</option><option value="approved" ${existing?.status==='approved'?'selected':''}>Favourite / approved</option></select></label><label>Tasting notes<textarea class="field" id="pair-note" placeholder="What did you think?">${esc(existing?.note||'')}</textarea></label><div class="actions"><button class="primary" id="pair-save">Save pairing</button>${existing?'<button class="secondary" id="pair-remove">Remove my rating</button>':''}</div>`;
document.getElementById('gnt-back').onclick=render;
document.getElementById('pair-save').onclick=()=>{pairings=pairings.filter(p=>!(p.gin===gin&&p.tonic===tonic));pairings.push({gin,tonic,status:document.getElementById('pair-status').value,note:document.getElementById('pair-note').value.trim()});save('cocktail_pairings_v3',pairings);render()};
if(existing)document.getElementById('pair-remove').onclick=()=>{pairings=pairings.filter(p=>!(p.gin===gin&&p.tonic===tonic));save('cocktail_pairings_v3',pairings);render()};
}
function renderLibrary(){
 if(librarySelected){const r=library.find(x=>x.id===librarySelected);if(!r){librarySelected=null;return renderLibrary()}
 const saved=all().some(x=>x.id==='custom-'+r.id);
 app.innerHTML=`<button class="back" id="lib-back">← Cocktail Library</button><h1 style="font-size:30px">${esc(r.name)}</h1><p>${esc(r.category)} · Classic reference recipe</p><h3 class="section">Ingredients</h3><div class="card">${r.ingredients.map(([n,q])=>`<div class="ingredient"><span>${esc(n)}</span><span>${esc(q)}</span></div>`).join('')}</div><h3 class="section">How to make it</h3><ol class="steps">${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="actions"><button class="primary" id="lib-save" ${saved?'disabled':''}>${saved?'✓ Already in My Cocktails':'＋ Add to My Cocktails'}</button></div><p class="small">Library recipes are examples, not personal approvals. You can mark a saved copy approved after tasting.</p>`;
 document.getElementById('lib-back').onclick=()=>{librarySelected=null;render()};
 document.getElementById('lib-save').onclick=()=>{if(saved)return;custom.push({...r,id:'custom-'+r.id,status:'new',note:'Saved from Cocktail Library · Not yet tested'});save('cocktail_custom_v1',custom);go('collection');selected='custom-'+r.id;render()};return;
 }
 const cats=['all',...new Set(library.map(x=>x.category))];
 const rs=library.filter(x=>(libraryCategory==='all'||x.category===libraryCategory)&&x.name.toLowerCase().includes(libraryQuery.toLowerCase()));
 app.innerHTML=`<h2>Cocktail Library</h2><p>Explore ${library.length} classic recipes. Your personal favourites stay separate in My Cocktails.</p><input class="search" id="lib-search" placeholder="Search classic cocktails…" value="${esc(libraryQuery)}"><div class="chips">${cats.map(c=>`<button class="chip ${libraryCategory===c?'on':''}" data-lib-cat="${esc(c)}">${esc(c==='all'?'All spirits':c)}</button>`).join('')}</div><div class="count">${rs.length} recipes</div>${rs.map(r=>`<button class="card recipe" data-lib-open="${esc(r.id)}"><div><div class="name">${esc(r.name)}</div><div class="muted">${esc(r.category)} · ${r.ingredients.length} ingredients</div></div><span style="font-size:25px;color:#d4a66d">›</span></button>`).join('')||'<div class="empty">No matching cocktails.</div>'}`;
 document.getElementById('lib-search').oninput=e=>{libraryQuery=e.target.value;let pos=e.target.selectionStart;render();let s=document.getElementById('lib-search');s.focus();s.setSelectionRange(pos,pos)};
 app.querySelectorAll('[data-lib-cat]').forEach(b=>b.onclick=()=>{libraryCategory=b.dataset.libCat;render()});
 app.querySelectorAll('[data-lib-open]').forEach(b=>b.onclick=()=>{librarySelected=b.dataset.libOpen;render();scrollTo(0,0)});
}
function render(){tabs();if(tab==='library'){renderLibrary();return}if(tab==='gnt'){renderGnt();return}if(selected){let r=all().find(x=>x.id===selected);if(r)return detail(r);selected=null}if(tab==='collection'){let rs=all().filter(r=>(filter==='all'||r.status===filter)&&r.name.toLowerCase().includes(query.toLowerCase()));app.innerHTML=`<input class="search" id="search" placeholder="Search cocktails…" value="${esc(query)}" aria-label="Search cocktails"><div class="chips">${[['all','All'],['approved','Approved'],['favorite','Favourites'],['new','To try']].map(([v,t])=>`<button class="chip ${filter===v?'on':''}" data-filter="${v}">${t}</button>`).join('')}</div><div class="count">${rs.length} cocktails</div>${rs.map(r=>item(r)).join('')||'<div class="empty">No cocktails match your search.</div>'}`;document.getElementById('search').oninput=e=>{query=e.target.value;let pos=e.target.selectionStart;render();let s=document.getElementById('search');s.focus();s.setSelectionRange(pos,pos)};app.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()})}
else if(tab==='pantry'){let names=[...new Set([...defaults,...extras,...all().flatMap(r=>r.ingredients.map(x=>x[0]))])].sort((a,b)=>a.localeCompare(b));let possible=all().filter(r=>missing(r).length===0),almost=all().filter(r=>missing(r).length===1);app.innerHTML=`<h2>What's in your bar?</h2><p>Tap everything you have. Ice counts as an ingredient, but optional garnishes don't.</p><div class="actions"><button class="secondary" id="allclear">Clear selection</button></div><div class="chips">${names.map(n=>`<button class="chip ${has(n)?'on':''}" data-ingredient="${esc(n)}">${esc(n)}</button>`).join('')}</div><div class="actions"><input class="field" style="flex:1;min-width:150px" id="newingredient" placeholder="Add an ingredient"><button class="secondary" id="addingredient">Add</button></div><h3 class="section">You can make (${possible.length})</h3>${possible.map(r=>item(r)).join('')||'<div class="empty">Select ingredients above to see matching cocktails.</div>'}<h3 class="section">Just one ingredient missing (${almost.length})</h3>${almost.map(r=>item(r,'Missing: '+missing(r).join(', '))).join('')||'<p class="small">No near matches yet.</p>'}`;app.querySelectorAll('[data-ingredient]').forEach(b=>b.onclick=()=>{let n=b.dataset.ingredient;pantry=pantry.includes(n)?pantry.filter(x=>x!==n):[...pantry,n];save('cocktail_pantry_v1',pantry);render()});document.getElementById('allclear').onclick=()=>{pantry=[];save('cocktail_pantry_v1',pantry);render()};document.getElementById('addingredient').onclick=()=>{let n=document.getElementById('newingredient').value.trim();if(n){if(!extras.includes(n)&&!defaults.includes(n))extras.push(n);if(!pantry.includes(n))pantry.push(n);save('cocktail_extras_v1',extras);save('cocktail_pantry_v1',pantry);render()}}}
else{app.innerHTML=`<h2>Add a cocktail</h2><p>Add an experiment now, then mark it approved when you've tasted it.</p><form id="recipeform"><label>Name<input required class="field" name="name" maxlength="90" placeholder="e.g. Manhattan"></label><label>Notes<input class="field" name="note" maxlength="200" placeholder="What makes it special?"></label><label>Ingredients (one per line: ingredient | amount)<textarea required class="field" name="ingredients" placeholder="Jim Beam bourbon | 60 ml&#10;Cocchi Vermouth di Torino Rosso | 30 ml&#10;Angostura bitters | 2 dashes&#10;Ice | Plenty"></textarea></label><label>Instructions (one step per line)<textarea required class="field" name="steps" placeholder="Combine ingredients in a mixing glass&#10;Stir with ice&#10;Strain and serve"></textarea></label><label class="toggle"><input type="checkbox" name="approved"> Already tested and approved</label><button class="primary" type="submit">Save cocktail</button></form>`;document.getElementById('recipeform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),ingredients=String(f.get('ingredients')).split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{let [n,...q]=x.split('|');return[n.trim(),q.join('|').trim()||'To taste']}),steps=String(f.get('steps')).split('\n').map(x=>x.trim()).filter(Boolean);if(!ingredients.length||!steps.length)return alert('Please add ingredients and instructions.');let r={id:'custom-'+Date.now(),name:String(f.get('name')).trim(),note:String(f.get('note')).trim(),status:f.has('approved')?'approved':'new',ingredients,steps};custom.push(r);save('cocktail_custom_v1',custom);go('collection');selected=r.id;render()}}app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{selected=b.dataset.open;render();scrollTo(0,0)})}render();

// Backup preserves all cocktail app data keys, including user-added recipes and G&T ratings.
const backupKeys=['cocktail_custom_v1','cocktail_pantry_v1','cocktail_extras_v1','cocktail_gins_v3','cocktail_tonics_v3','cocktail_pairings_v3'];
document.getElementById('export-backup').onclick=()=>{
 const data={app:'my-cocktail-bar',version:1,exportedAt:new Date().toISOString(),values:{}};
 backupKeys.forEach(k=>{const v=localStorage.getItem(k);if(v!==null)data.values[k]=JSON.parse(v)});
 const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-cocktail-bar-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);
};
document.getElementById('import-backup').onclick=()=>document.getElementById('backup-file').click();
document.getElementById('backup-file').onchange=async e=>{
 const file=e.target.files[0];if(!file)return;
 try{const data=JSON.parse(await file.text());if(data.app!=='my-cocktail-bar'||!data.values||typeof data.values!=='object'||Array.isArray(data.values))throw Error('Not a My Cocktail Bar backup');
 const keys=backupKeys.filter(k=>Object.prototype.hasOwnProperty.call(data.values,k));
 if(!keys.length)throw Error('No recognized data');
 if(!confirm('Import '+keys.length+' saved sections? This will replace matching data currently saved in this browser.'))return;
 keys.forEach(k=>localStorage.setItem(k,JSON.stringify(data.values[k])));location.reload();
 }catch(err){alert('Import failed: '+err.message)}finally{e.target.value=''}
};
if('serviceWorker' in navigator && location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
